# Settings of the GunBound port; read by GunBound.sh as a shell file.

# The account. The server this client was tested with creates an account on
# its first login, with the password 1234. At most 16 characters each.
# Not used when token.txt exists.
GB_USER=player
GB_PASSWORD=1234

# The server: the machine that runs the broker, and the broker's port.
GB_BROKER=192.168.1.10:8372

# Further options for the program (run ./gunbound --help over ssh for the list), for example
#   --pad-speed 800           a faster pointer
#   --filter linear           smoother scaling (default: sharp)
#   --scale-mode stretch      fill the 16:9 screen
#   --no-sound
#   --guest-cpu any           let the game's threads use every CPU (see README.txt)
GB_OPTIONS=""
